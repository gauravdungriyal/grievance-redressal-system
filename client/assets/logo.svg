<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Geometric Shield Concept -->
  <defs>
    <linearGradient id="shieldGradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/> <!-- Indigo-600 -->
      <stop offset="1" stop-color="#9333EA"/> <!-- Purple-600 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Back Shield Layer -->
  <path d="M100 20C70 20 40 30 25 55C25 90 25 130 100 180C175 130 175 90 175 55C160 30 130 20 100 20Z" fill="url(#shieldGradient)" fill-opacity="0.1" />
  
  <!-- Main Shield Outline -->
  <path d="M100 30L35 60V105C35 145 100 180 100 180C100 180 165 145 165 105V60L100 30Z" stroke="url(#shieldGradient)" stroke-width="8" stroke-linejoin="round" />
  
  <!-- 'CS' Circuit Patterns -->
  <path d="M75 75H125M75 100H110M75 125H125" stroke="url(#shieldGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Redressal Checkmark/Support Symbol -->
  <path d="M85 150L95 160L125 130" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
